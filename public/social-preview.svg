    <text x="54" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">3</text>
    <text x="91" y="120" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#173137">Fechar</text>
