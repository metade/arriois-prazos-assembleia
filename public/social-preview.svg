    <text x="91" y="218" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#173137">Enviar</text>
    <text x="91" y="243" font-family="Arial, sans-serif" font-size="17" fill="#536b69">aos membros</text>
    <text x="91" y="316" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#173137">Divulgar</text>
    <text x="91" y="341" font-family="Arial, sans-serif" font-size="17" fill="#536b69">ao público</text>
