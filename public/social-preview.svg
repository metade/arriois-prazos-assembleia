    <text x="74" y="42" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#315b58">CALENDÁRIO DA SESSÃO</text>
    <path d="M54 118V316" stroke="#a9c9bd" stroke-width="3"/>
    <circle cx="54" cy="124" r="21" fill="#1d615a"/>
    <circle cx="54" cy="222" r="21" fill="#1d615a"/>
    <circle cx="54" cy="320" r="21" fill="#1d615a"/>
