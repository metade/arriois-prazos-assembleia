<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Os prazos, antes da assembleia — Arroios</title>
  <desc id="desc">Calendário para preparar a convocatória, os documentos e a divulgação da sessão.</desc>
  <rect width="1200" height="630" fill="#173c42"/>
  <circle cx="1102" cy="70" r="252" fill="#21545a"/>
  <circle cx="1092" cy="556" r="256" fill="#225057"/>
  <path d="M0 566H1200" stroke="#84b8a9" stroke-opacity=".35" stroke-width="2"/>

  <circle cx="88" cy="83" r="31" fill="none" stroke="#d7e9e2" stroke-width="3"/>
  <text x="88" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#f7f8f6">A</text>
  <text x="139" y="76" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#f7f8f6">ASSEMBLEIA DE ARROIOS</text>
  <text x="140" y="102" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#b9d9ce">PRAZOS DA SESSÃO</text>

  <text x="64" y="251" font-family="Georgia, serif" font-size="71" fill="#f7f8f6">Os prazos, antes</text>
  <text x="64" y="335" font-family="Georgia, serif" font-size="71" fill="#f7f8f6">da assembleia.</text>
  <rect x="67" y="367" width="102" height="6" rx="3" fill="#bd784a"/>
  <text x="65" y="430" font-family="Arial, sans-serif" font-size="25" fill="#d5e8e2">Convocatória, documentos e divulgação</text>
  <text x="65" y="464" font-family="Arial, sans-serif" font-size="25" fill="#d5e8e2">com os prazos à vista.</text>

  <g transform="translate(786 140)">
    <rect x="9" y="12" width="344" height="382" rx="16" fill="#0c292e" opacity=".34"/>
    <rect width="344" height="382" rx="16" fill="#f7f8f6"/>
    <rect width="344" height="71" rx="16" fill="#e9f0ec"/>
    <rect y="55" width="344" height="16" fill="#e9f0ec"/>
    <circle cx="32" cy="36" r="5" fill="#bd784a"/>
